<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Marine Drive Deco</title>
<link href="https://fonts.googleapis.com/css2?family=Kalnia:wght@300;500&family=Anek+Latin:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0}
html,body{width:1440px;height:900px;overflow:hidden}
body{background:#f6f0e5;color:#1f3b33;font-family:'Anek Latin',sans-serif}
header{height:84px;display:flex;align-items:center;justify-content:space-between;padding:0 72px}
.brand{font-family:Kalnia;font-weight:500;font-size:26px;letter-spacing:.02em}
nav{display:flex;gap:36px;font-size:17px;font-weight:500;align-items:center}
.btn{display:inline-flex;align-items:center;height:52px;padding:0 28px;font-weight:600;font-size:17px}
.sm{height:44px;padding:0 20px;font-size:16px}
.primary{background:#1f3b33;color:#f6f0e5}
.ghost{box-shadow:inset 0 0 0 1px #1f3b33}
.cornice{margin:0 72px;height:14px;border-top:1px solid #1f3b33;border-bottom:1px solid rgba(31,59,51,.35)}
main{display:grid;grid-template-columns:6fr 5fr;gap:72px;padding:40px 72px 0;height:800px}
.arch{border-radius:300px 300px 0 0;overflow:hidden;height:700px;outline:1px solid #d8902f;outline-offset:10px}
.arch img{width:100%;height:100%;object-fit:cover;object-position:50% 55%;display:block}
.copy{display:flex;flex-direction:column;justify-content:center;padding-bottom:80px}
.k{font-size:16px;font-weight:600;color:#9a5d17;margin-bottom:22px}
h1{font-family:Kalnia;font-weight:300;font-size:92px;line-height:.96;letter-spacing:-.01em}
.steps{display:flex;gap:6px;margin:30px 0}
.steps i{display:block;height:1px;background:#d8902f}
.lede{font-size:22px;line-height:1.45;max-width:30ch;color:#2f4a42}
.actions{display:flex;gap:16px;margin-top:38px}
</style></head><body>
<header><div class="brand">Bombay Palace</div>
<nav><span>Menu</span><span>Visit</span><span class="btn sm ghost">Get directions</span></nav></header>
<div class="cornice"></div>
<main>
<div class="arch"><img src="../../../dist/assets/menu-all.webp" alt=""></div>
<section class="copy">
<h1>Bombay Palace</h1>
<div class="steps"><i style="width:120px"></i><i style="width:40px"></i><i style="width:12px"></i></div>
<p class="lede">Indian cuisine on Macon Road, Columbus, Georgia: tandoori, samosas and slow-cooked daal.</p>
<div class="actions"><span class="btn primary">Explore the menu</span><span class="btn ghost">Get directions</span></div>
</section></main>
</body></html>
