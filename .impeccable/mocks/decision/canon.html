<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Category standard</title>
<link href="https://fonts.googleapis.com/css2?family=Libre+Caslon+Display&family=Karla:wght@400;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0}
html,body{width:1440px;height:900px;overflow:hidden}
body{font-family:Karla,sans-serif;color:#fff;position:relative}
img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.shade{position:absolute;inset:0;background:rgba(0,0,0,.45)}
header{position:relative;height:84px;display:flex;align-items:center;justify-content:space-between;padding:0 64px}
.brand{font-family:'Libre Caslon Display';font-size:28px}
nav{display:flex;gap:34px;font-size:17px;align-items:center}
.btn{display:inline-flex;align-items:center;height:52px;padding:0 28px;font-weight:600;font-size:17px;border-radius:2px}
.primary{background:#b8462a}
.ghost{box-shadow:inset 0 0 0 1.5px #fff}
.c{position:relative;text-align:center;padding-top:230px}
h1{font-family:'Libre Caslon Display';font-weight:400;font-size:104px;line-height:1}
p{font-size:22px;margin-top:20px}
.a{display:flex;gap:16px;justify-content:center;margin-top:40px}
</style></head><body>
<img src="../../../dist/assets/menu-all.webp" alt=""><div class="shade"></div>
<header><div class="brand">Bombay Palace</div><nav><span>Menu</span><span>Visit</span><span class="btn ghost" style="height:44px">Get directions</span></nav></header>
<div class="c"><h1>Bombay Palace</h1><p>Authentic Indian cuisine in Columbus, Georgia</p>
<div class="a"><span class="btn primary">Explore the menu</span><span class="btn ghost">Get directions</span></div></div>
</body></html>
