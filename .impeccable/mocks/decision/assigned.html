<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Painted Menu Board</title>
<link href="https://fonts.googleapis.com/css2?family=Yatra+One&family=Mukta:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0}
html,body{width:1440px;height:900px;overflow:hidden}
body{background:#f7f1e6;color:#1e3a2f;font-family:Mukta,sans-serif}
header{height:84px;display:flex;align-items:center;justify-content:space-between;padding:0 64px;border-bottom:1px solid rgba(30,58,47,.14)}
.brand{font-family:'Yatra One';font-size:28px;display:flex;gap:12px;align-items:center}
.brand i{width:22px;height:28px;border:2px solid #b4532a;border-bottom:0;border-radius:11px 11px 0 0;display:block}
nav{display:flex;gap:36px;font-size:17px;font-weight:500;align-items:center}
.btn{display:inline-flex;align-items:center;height:52px;padding:0 26px;font-weight:600;font-size:17px;border-radius:4px}
.sm{height:44px;padding:0 20px;font-size:16px}
.primary{background:#e0962b;color:#1b1a12}
.ghost{box-shadow:inset 0 0 0 1.5px #1e3a2f}
main{display:grid;grid-template-columns:5fr 7fr;height:816px}
.copy{padding:0 56px 0 64px;display:flex;flex-direction:column;justify-content:center}
h1{font-family:'Yatra One';font-weight:400;font-size:84px;line-height:1;letter-spacing:-.01em}
.rule{width:180px;height:10px;margin:22px 0 26px;background:#e0962b;border-radius:6px 2px 7px 3px;transform:rotate(-1deg)}
.lede{font-size:26px;line-height:1.35;font-weight:500;max-width:22ch}
.where{margin-top:14px;font-size:18px;line-height:1.6;color:#3d5249}
.actions{display:flex;gap:16px;margin-top:36px}
.photo{position:relative;padding:40px 64px 40px 0}
.photo img{width:100%;height:100%;object-fit:cover;object-position:50% 60%;border-radius:4px;display:block}
.board{position:absolute;left:-40px;bottom:72px;background:#f7f1e6;padding:22px 26px;width:330px;border-radius:4px}
.board b{font-family:'Yatra One';font-weight:400;font-size:24px;display:block;margin-bottom:8px}
.row{display:flex;justify-content:space-between;font-size:17px;padding:7px 0;border-top:1px solid rgba(30,58,47,.14)}
.row span:last-child{font-weight:600;font-variant-numeric:tabular-nums}
.note{position:absolute;right:76px;bottom:52px;font-size:13px;color:#fff;opacity:.9}
</style></head><body>
<header><div class="brand"><i></i>Bombay Palace</div>
<nav><span>Menu</span><span>Visit</span><span class="btn sm ghost">Get directions</span></nav></header>
<main>
<section class="copy">
<h1>Bombay Palace</h1>
<div class="rule"></div>
<p class="lede">Indian cooking from the clay oven and the kitchen stove.</p>
<p class="where">4213 Macon Rd, Columbus, Georgia</p>
<div class="actions"><span class="btn primary">Explore the menu</span><span class="btn ghost">Get directions</span></div>
</section>
<section class="photo"><img src="../../../dist/assets/menu-all.webp" alt="">
<div class="board"><b>From the board</b>
<div class="row"><span>Veg Samosa</span><span>$4.99</span></div>
<div class="row"><span>Chicken Tikka</span><span>$14.99</span></div>
<div class="row"><span>Daal Soup</span><span>$3.50</span></div></div>
<p class="note">Illustrative photograph</p>
</section></main>
</body></html>
